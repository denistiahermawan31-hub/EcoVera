<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1d3327">
<meta name="description" content="Galeri foto EcoVera: jelajahi dokumentasi aksi peduli lingkungan lewat lorong galeri 3D.">
<title>Galeri | EcoVera</title>
<link rel="preload" as="image" href="assets/images/gallery/01.jpg">
<link rel="preload" as="image" href="assets/images/gallery/02.jpg">
<link rel="stylesheet" href="css/gallery.css">
</head>
<body>
<main id="scene" aria-label="Galeri foto EcoVera"><div id="world"></div></main>

<noscript><p class="nojs">Galeri membutuhkan JavaScript. <a href="index.html">Kembali ke beranda</a></p></noscript>

<a class="ui pill home" href="index.html" aria-label="Kembali ke beranda">
  <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 11l8-7 8 7M6 10v10h4v-6h4v6h4V10"/></svg>
  <span>Beranda</span>
</a>

<div class="ui pill count" id="count" aria-hidden="true">01 / 20</div>

<div class="ui dock">
  <div class="caption">
    <strong id="capTitle"></strong>
    <small id="hint">
      <span class="h-fine">Gunakan panah keyboard atau tombol untuk berjalan &middot; klik foto untuk memperbesar</span>
      <span class="h-touch">Geser untuk berjalan &middot; ketuk foto untuk memperbesar</span>
    </small>
  </div>
  <div class="nav">
    <button id="prev" class="btn" type="button" aria-label="Foto sebelumnya" title="Foto sebelumnya"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg></button>
    <div class="track" aria-hidden="true"><i id="bar"></i></div>
    <button id="next" class="btn" type="button" aria-label="Foto berikutnya" title="Foto berikutnya"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg></button>
  </div>
</div>

<p id="live" class="sr" role="status" aria-live="polite"></p>

<div id="lightbox" role="dialog" aria-modal="true" aria-label="Pratinjau foto" aria-hidden="true">
  <img id="lbImg" alt="" decoding="async">
  <div class="lbbar" aria-live="polite"><span id="lbCount"></span><span id="lbCap"></span></div>
  <button id="lbPrev" class="btn lbnav lbprev" type="button" aria-label="Foto sebelumnya"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg></button>
  <button id="lbNext" class="btn lbnav lbnext" type="button" aria-label="Foto berikutnya"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg></button>
  <button id="close" class="btn" type="button" aria-label="Tutup pratinjau"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 5l14 14M19 5L5 19"/></svg></button>
</div>

<script src="js/gallery.js"></script>
</body>
</html>
