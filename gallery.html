<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Galeri — EcoVera</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500&family=Instrument+Serif:ital@1&family=Manrope:wght@600;700;800&display=swap" rel="stylesheet"/>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <main id="main">
      <div class="page">
        <h1>Galeri dokumentasi</h1>
        <!-- <p class="lead">
          Klik foto untuk memperbesar. Tempatkan foto Anda di
          <code>assets/images/</code> dan hubungkan lewat atribut
          <code>--img</code> pada tiap kotak.
        </p> -->
        <div class="grid">
          <figure class="w t">
            <div class="photo"></div>
            <figcaption>Pemilahan sampah di rumah tangga</figcaption>
          </figure>
          <figure>
            <div class="photo" style="filter: hue-rotate(20deg)"></div>
            <figcaption>Sampah plastik di sungai</figcaption>
          </figure>
          <figure>
            <div class="photo" style="filter: hue-rotate(-20deg)"></div>
            <figcaption>Kompos dari sisa dapur</figcaption>
          </figure>
          <figure class="w">
            <div class="photo" style="filter: hue-rotate(40deg)"></div>
            <figcaption>Bank sampah komunitas</figcaption>
          </figure>
          <figure>
            <div class="photo"></div>
            <figcaption>Kegiatan bersih pantai</figcaption>
          </figure>
          <figure class="t">
            <div class="photo" style="filter: hue-rotate(-30deg)"></div>
            <figcaption>Daur ulang kertas dan kardus</figcaption>
          </figure>
        </div>
      </div>
      <dialog>
        <div class="photo"></div>
        <div><p></p></div>
        <form method="dialog"><button class="btn">Tutup</button></form>
      </dialog>
    </main>
    <script src="js/script.js"></script>
  </body>
</html>
