<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#071e14">
<meta name="description" content="Galeri foto EcoVera: jelajahi dokumentasi aksi peduli lingkungan lewat tumpukan foto 3D.">
<title>Galeri | EcoVera</title>
<link rel="icon" type="image/png" href="assets/images/logo1.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link
  href="https://fonts.googleapis.com/css2?family=Nunito:ital,wght@0,200..1000;1,200..1000&display=swap"
  rel="stylesheet"
/>
<link rel="preload" as="image" href="assets/images/Foto1.png">
<link rel="preload" as="image" href="assets/images/Foto2.png">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/gallery.css">
</head>
<body class="gallery-page">
<main id="scene" aria-label="Galeri foto EcoVera"><div id="world"></div></main>

<!-- <noscript>
  <p class="nojs">Galeri membutuhkan JavaScript. <a href="index.html">Kembali ke beranda</a></p>
</noscript> -->

<p id="live" class="sr" role="status" aria-live="polite"></p>

<button id="prev" class="ui btn edge edge-prev" type="button" aria-label="Foto sebelumnya" title="Foto sebelumnya"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg></button>
<button id="next" class="ui btn edge edge-next" type="button" aria-label="Foto berikutnya" title="Foto berikutnya"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg></button>

<div id="lightbox" role="dialog" aria-modal="true" aria-label="Pratinjau foto" aria-hidden="true">
  <img id="lbImg" alt="" decoding="async">
  <div class="lbbar" aria-live="polite"><span id="lbCap"></span></div>
  <button id="lbPrev" class="btn lbnav lbprev" type="button" aria-label="Foto sebelumnya"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg></button>
  <button id="lbNext" class="btn lbnav lbnext" type="button" aria-label="Foto berikutnya"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg></button>
  <button id="close" class="btn" type="button" aria-label="Tutup pratinjau"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 5l14 14M19 5L5 19"/></svg></button>
</div>

<script type="module" src="js/script.js"></script>
<script type="module" src="js/gallery.js"></script>
</body>
</html>
